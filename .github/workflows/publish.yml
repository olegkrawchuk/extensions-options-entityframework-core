name: Publish

on:
  push:
    tags: ["v*.*.*"]

env:
  SOLUTION: Extensions.Options.EntityFrameworkCore.sln
  LIBRARY_PROJECT: src/Extensions.Options.EntityFrameworkCore/Extensions.Options.EntityFrameworkCore.csproj
  TEST_PROJECT: tests/Extensions.Options.EntityFrameworkCore.Tests/Extensions.Options.EntityFrameworkCore.Tests.csproj

jobs:
  publish-stable:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    # Required for GitHub to issue the OIDC token that nuget.org's Trusted Publishing policy
    # exchanges for a short-lived (1 hour) API key — no NUGET_API_KEY secret needed.
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Publish only ever runs after tests pass.
      - name: Test
        run: dotnet test --project ${{ env.TEST_PROJECT }} --configuration Release --no-build

      # Version comes from <VersionPrefix> in the csproj. The tag (e.g. v2.0.0) and
      # <VersionPrefix> must be kept in sync manually at release time; this workflow does not
      # enforce that, it only decides *when* to publish (an explicit tag push on main), not *what*
      # version — per project convention, <Version>/<VersionPrefix> is only ever changed by an
      # explicit release decision, never by CI.
      - name: Pack
        run: dotnet pack ${{ env.LIBRARY_PROJECT }} --configuration Release --no-build --output ./nupkg

      # Requested right before the push — the exchanged API key is only valid for 1 hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # dotnet.exe receives argument strings literally from PowerShell — "*.nupkg" is not
        # shell-expanded before reaching it, so the wildcard must be resolved here instead.
        run: |
          $package = Get-ChildItem -Path ./nupkg -Filter *.nupkg | Select-Object -First 1 -ExpandProperty FullName
          if (-not $package) { throw "No .nupkg file found in ./nupkg" }
          dotnet nuget push $package --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
