name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLUTION: Extensions.Options.EntityFrameworkCore.sln

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/Extensions.Options.EntityFrameworkCore.Tests/Extensions.Options.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
